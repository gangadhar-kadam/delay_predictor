version: '3.8'

services:
  delay-predictor:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BENCH_NAME=delay_predictor_bench
      - SITE_NAME=delay_predictor_site
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=delay_predictor_db
      - DB_USER=root
      - DB_PASSWORD=root
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    depends_on:
      - db
      - redis-cache
      - redis-queue
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./logs:/home/frappe/frappe-bench/logs
    networks:
      - delay-predictor-network

  db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=delay_predictor_db
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - delay-predictor-network

  redis-cache:
    image: redis:6-alpine
    ports:
      - "13000:6379"
    volumes:
      - redis-cache-data:/data
    networks:
      - delay-predictor-network

  redis-queue:
    image: redis:6-alpine
    ports:
      - "11000:6379"
    volumes:
      - redis-queue-data:/data
    networks:
      - delay-predictor-network

  worker:
    build: .
    command: bench worker --queue default
    environment:
      - BENCH_NAME=delay_predictor_bench
      - SITE_NAME=delay_predictor_site
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=delay_predictor_db
      - DB_USER=root
      - DB_PASSWORD=root
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    depends_on:
      - db
      - redis-cache
      - redis-queue
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./logs:/home/frappe/frappe-bench/logs
    networks:
      - delay-predictor-network

  scheduler:
    build: .
    command: bench schedule
    environment:
      - BENCH_NAME=delay_predictor_bench
      - SITE_NAME=delay_predictor_site
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=delay_predictor_db
      - DB_USER=root
      - DB_PASSWORD=root
      - REDIS_CACHE=redis://redis-cache:6379
      - REDIS_QUEUE=redis://redis-queue:6379
    depends_on:
      - db
      - redis-cache
      - redis-queue
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites
      - ./logs:/home/frappe/frappe-bench/logs
    networks:
      - delay-predictor-network

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:

networks:
  delay-predictor-network:
    driver: bridge
